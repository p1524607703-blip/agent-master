<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福州去哪抽签机 · 真随机版</title>
<style>
  :root{
    --green:#1b7f5c;
    --green-soft:#e6f4ee;
    --orange:#e8552d;
    --ink:#1f2a24;
    --ink-2:#5d6b64;
    --line:#e3eae6;
    --card:#ffffff;
    --gold:#c9962f;
    --purple:#7a5bd6;
    --shadow:0 10px 30px rgba(27,127,92,.10), 0 2px 8px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #e9f6f0 0%, rgba(233,246,240,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #eaf0ff 0%, rgba(234,240,255,0) 55%),
      #f7faf8;
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto}

  header{text-align:center;margin-bottom:20px}
  .badge{
    display:inline-block;font-size:12px;letter-spacing:.12em;color:var(--green);
    background:var(--green-soft);border:1px solid #cfe8dc;padding:5px 12px;border-radius:999px;
  }
  h1{font-size:27px;margin:12px 0 6px;letter-spacing:.02em}
  h1 span{color:var(--orange)}
  .sub{color:var(--ink-2);font-size:13.5px;margin:0}

  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}

  .label{font-size:12px;color:var(--ink-2);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .chip:hover{border-color:var(--green);color:var(--green)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}

  .machine{
    text-align:center;padding:28px 18px 24px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#ffffff 0%,#fbfefc 100%);
  }
  .slot{
    min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .slot-area{font-size:13px;color:var(--ink-2);letter-spacing:.08em}
  .slot-name{
    font-size:30px;font-weight:800;line-height:1.25;letter-spacing:.02em;
    background:linear-gradient(90deg,#12805a,#3aa17c 60%,#e8552d);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .slot-name.idle{background:none;color:#c9d4ce;-webkit-text-fill-color:#c9d4ce}
  .slot-desc{font-size:13.5px;color:var(--ink-2);max-width:520px;line-height:1.7}
  .meta-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .tag{font-size:11.5px;padding:4px 10px;border-radius:999px;background:#f2f6f4;color:var(--ink-2)}
  .tag.rar-SSR{background:#fdf3dc;color:#9a6f12;border:1px solid #f0dcaa}
  .tag.rar-SR{background:#f1edfd;color:#5b3fb3;border:1px solid #ded4fa}
  .tag.rar-R{background:#eef3f8;color:#4a6070;border:1px solid #dbe6ee}

  .main-row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
  .draw-btn{
    margin-top:0;border:none;cursor:pointer;
    background:linear-gradient(135deg,#1b7f5c,#29a37a);
    color:#fff;font-size:17px;font-weight:700;letter-spacing:.06em;
    padding:14px 40px;border-radius:999px;box-shadow:0 8px 22px rgba(27,127,92,.28);
    transition:transform .12s ease, box-shadow .2s ease;
  }
  .draw-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(27,127,92,.34)}
  .draw-btn:active{transform:translateY(1px) scale(.98)}
  .draw-btn[disabled]{opacity:.55;pointer-events:none}
  .ghost-btn{
    background:#fff;border:1px solid var(--line);color:var(--ink-2);
    padding:10px 20px;border-radius:999px;font-size:13.5px;cursor:pointer;transition:.15s
  }
  .ghost-btn:hover{border-color:var(--green);color:var(--green)}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap;align-items:center}
  .switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
  .switch input{accent-color:var(--green);width:15px;height:15px}

  .history{font-size:13px;color:var(--ink-2)}
  .history ul{list-style:none;margin:10px 0 0;padding:0}
  .history li{padding:7px 0;border-top:1px dashed var(--line);display:flex;gap:8px;align-items:center}
  .history li:first-child{border-top:none}
  .history .h-area{font-size:11.5px;color:#fff;background:var(--green);padding:2px 8px;border-radius:999px;flex:none}
  .history .empty{color:#a9b5af;font-size:12.5px}

  /* ---------- 弹窗 ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(22,35,30,.42);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .mask.show{opacity:1;pointer-events:auto}
  .modal{
    width:100%;max-width:420px;background:#fff;border-radius:22px;padding:26px 22px 24px;
    box-shadow:0 26px 60px rgba(0,0,0,.22);text-align:center;position:relative;
    transform:translateY(14px) scale(.97);transition:transform .26s cubic-bezier(.2,.9,.3,1.1);
  }
  .mask.show .modal{transform:none}
  .modal .heart{font-size:34px;line-height:1}
  .modal h2{font-size:21px;margin:10px 0 6px}
  .modal .spot{font-size:23px;font-weight:800;color:var(--green);margin:2px 0 8px;letter-spacing:.02em}
  .modal .why{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin-bottom:20px}
  .answers{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:52px}
  .yes{
    border:none;cursor:pointer;background:linear-gradient(135deg,#e8552d,#f4833f);color:#fff;
    font-size:16px;font-weight:700;padding:13px 30px;border-radius:999px;
    box-shadow:0 8px 20px rgba(232,85,45,.3);transition:transform .12s
  }
  .yes:hover{transform:scale(1.04)}
  .no{
    border:1px solid var(--line);background:#f7faf8;color:var(--ink-2);cursor:pointer;
    font-size:15px;padding:12px 24px;border-radius:999px;transition:transform .12s ease-out;
  }
  .no.fixed{position:fixed;box-shadow:0 10px 24px rgba(0,0,0,.16);z-index:99}
  .done-wrap{margin-top:14px}
  .done-title{font-size:20px;font-weight:800;color:var(--green)}
  .done-sub{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.7}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
    background:rgba(31,42,36,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
    opacity:0;transition:.25s;z-index:200;pointer-events:none
  }
  .toast.show{opacity:1;transform:translateX(-50%)}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:150}
  footer{text-align:center;color:#a9b5af;font-size:12px;margin-top:26px;line-height:1.8}
  @media (max-width:520px){
    h1{font-size:23px}
    .slot-name{font-size:25px}
    .modal{padding:22px 18px 20px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">FUZHOU · 真随机 · 13 个县市区</div>
    <h1>福州去哪<span>抽签机</span></h1>
    <p class="sub">别再问「你想去哪」了。天命说去哪，就去哪。</p>
  </header>

  <div class="card">
    <p class="label">📍 想去哪个片区（可多选，不选=全福州）</p>
    <div class="chips" id="areaChips"></div>
  </div>

  <div class="card">
    <p class="label">🎯 想玩哪种类型</p>
    <div class="chips" id="typeChips"></div>
  </div>

  <div class="card machine">
    <div class="slot">
      <div class="slot-area" id="slotArea">机 器 待 机 中</div>
      <div class="slot-name idle" id="slotName">按下面的按钮</div>
      <div class="slot-desc" id="slotDesc">福州 13 个县市区 · 84 个坐标，抽到哪都是命。</div>
      <div class="meta-row" id="slotMeta"></div>
    </div>
    <div class="main-row">
      <button class="draw-btn" id="drawBtn">🎲 帮我抽一个</button>
    </div>
    <div class="btn-row">
      <button class="ghost-btn" id="againBtn">换个地方</button>
      <button class="ghost-btn" id="copyBtn">复制文案</button>
      <label class="switch"><input type="checkbox" id="uniqueOnly"> 不重复抽到同一个</label>
    </div>
  </div>

  <div class="card history">
    <p class="label" style="margin-bottom:4px">🧾 本次抽签记录</p>
    <ul id="historyList"><li class="empty">还没有记录。命运尚未开始。</li></ul>
  </div>

  <footer>
    数据纯手打 · 出行前记得查天气和开放时间<br>
    「不想去」按钮有点害羞，追不追看你。
  </footer>
</div>

<div class="mask" id="mask">
  <div class="modal" id="modal">
    <div class="heart">💌</div>
    <h2 id="askTitle">这个周末，去这儿？</h2>
    <div class="spot" id="askSpot">三坊七巷</div>
    <div class="why" id="askWhy"></div>
    <div id="answerBox">
      <div class="answers">
        <button class="yes" id="yesBtn">好啊，走！</button>
        <button class="no" id="noBtn">不想去</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:#a9b5af" id="escapeHint"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti" style="display:none"></canvas>

const AREAS = ["鼓楼","台江","仓山","马尾","晋安","长乐","闽侯","福清","平潭","连江","罗源","闽清","永泰"];

const TYPE_MAP = {
  "古厝巷弄":"古厝老街","古厝街区":"古厝老街","古厝":"古厝老街","古民居":"古厝老街","古镇":"古厝老街",
  "古村":"古村古寨","民族古村":"古村古寨","石头厝":"古村古寨","古建":"古村古寨",
  "文艺":"文艺建筑","文艺街区":"文艺建筑","建筑":"文艺建筑",
  "城景":"暮色江景","夜景":"暮色江景","江景":"暮色江景","落日":"暮色江景","江塔":"暮色江景",
  "老城烟火":"市井烟火","逛街":"市井烟火",
  "温泉遛娃":"温泉度假","森林温泉":"温泉度假","避暑山居":"温泉度假",

  "湖景":"城市园林","园林":"城市园林","城市绿肺":"城市园林",

  "海岛":"海岛海滩","海滩":"海岛海滩","海堤":"海岛海滩",
  "海蚀奇观":"山海奇观","海蚀地貌":"山海奇观","风车海":"山海奇观","山海画卷":"山海奇观","海岬":"山海奇观","江湖":"山海奇观",
  "山野":"山野徒步","城市爬山":"山野徒步","山野村落":"山野徒步","道教名山":"山野徒步",
  "山野禅寺":"山寺古刹","禅寺":"山寺古刹","古刹":"山寺古刹","山寺":"山寺古刹","禅意":"山寺古刹","古塔禅意":"山寺古刹","人文":"山寺古刹",
  "森林":"森林玩水","峡谷":"森林玩水","瀑布群":"森林玩水","溪谷":"森林玩水","玩水":"森林玩水","湿地观鸟":"森林玩水",
  "工业遗产":"历史人文","历史":"历史人文","史前文化":"历史人文","民族风情":"历史人文"
};
SPOTS.forEach(s => s[2] = TYPE_MAP[s[2]] || s[2]);

const TYPE_ORDER = ["古厝老街","古村古寨","山野徒步","山寺古刹","海岛海滩","山海奇观","森林玩水","暮色江景","市井烟火","文艺建筑","城市园林","花海田园","历史人文","温泉度假","遛娃亲子"];
const TYPE_ICON = {"古厝老街":"🏮","古村古寨":"🏚️","山野徒步":"⛰️","山寺古刹":"⛩️","海岛海滩":"🏝️","山海奇观":"🪨","森林玩水":"💦","暮色江景":"🌃","市井烟火":"🍜","文艺建筑":"🎨","城市园林":"🌳","花海田园":"🌻","历史人文":"🏛️","温泉度假":"♨️","遛娃亲子":"🎠"};

const $ = id => document.getElementById(id);
let selectedAreas = new Set();
let selectedType = "不限";
const history = [];

/* ---------- 筛选器 ---------- */
const areaBox = $("areaChips");
["全部"].concat(AREAS).forEach(a=>{
  const b = document.createElement("button");
  b.className = "chip" + (a==="全部"?" on":"");
  b.textContent = a;
  b.onclick = ()=>{
    if(a==="全部"){ selectedAreas.clear(); areaBox.querySelectorAll(".chip").forEach(c=>c.classList.remove("on")); b.classList.add("on"); }
    else{
      areaBox.querySelector(".chip").classList.remove("on");
      selectedAreas.has(a) ? selectedAreas.delete(a) : selectedAreas.add(a);
      b.classList.toggle("on");
      if(selectedAreas.size===0) areaBox.querySelector(".chip").classList.add("on");
    }
    updateCount();
  };
  areaBox.appendChild(b);
});

const present = new Set(SPOTS.map(s=>s[2]));
const types = ["不限", ...TYPE_ORDER.filter(t=>present.has(t)), ...Array.from(present).filter(t=>!TYPE_ORDER.includes(t))];
const typeBox = $("typeChips");
types.forEach(t=>{
  const b = document.createElement("button");
  b.className = "chip" + (t==="不限"?" on":"");
  b.textContent = t==="不限" ? "全部" : (TYPE_ICON[t] ? TYPE_ICON[t]+" "+t : t);
  b.onclick = ()=>{
    selectedType = t;
    typeBox.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    b.classList.add("on");
    updateCount();
  };
  typeBox.appendChild(b);
});

function pool(){
  return SPOTS.filter(s=>{
    const okArea = selectedAreas.size===0 || selectedAreas.has(s[1]);
    const okType = selectedType==="不限" || s[2]===selectedType;
    return okArea && okType;
  });
}
function updateCount(){
  $("slotDesc").textContent = current ? $("slotDesc").textContent : (
    pool().length
      ? pool().length + " / " + SPOTS.length + " 个坐标待命，按下面的按钮开抽。"
      : "这个组合下福州居然没有地方可去 —— 放宽点条件吧，杠精。"
  );
}

/* ---------- 抽取（真随机） ---------- */
let current = null, rolling = false;
function getCandidate(){
  let p = pool();
  if(!p.length) return null;
  if($("uniqueOnly").checked){
    const fresh = p.filter(s=>!history.find(h=>h.name===s[0]));
    if(fresh.length) p = fresh;
  }
  return p[Math.floor(Math.random()*p.length)];
}
function draw(){
  if(rolling) return;
  const target = getCandidate();
  if(!target){ toast("没得选了。要么放宽条件，要么关掉「不重复」。"); return; }
  rolling = true;
  $("drawBtn").disabled = true;
  $("slotMeta").innerHTML = "";
  const nm = $("slotName"), ar = $("slotArea");
  nm.classList.add("idle");
  let ticks = 0;
  const total = 22 + Math.floor(Math.random()*6);
  const timer = setInterval(()=>{
    const r = pool()[Math.floor(Math.random()*pool().length)] || target;
    nm.textContent = r[0]; ar.textContent = r[1] + " · " + r[2];
    ticks++;
    if(ticks>=total){
      clearInterval(timer);
      rolling = false;
      $("drawBtn").disabled = false;
      showResult(target);
    }
  }, 55);
}
function showResult(s){
  current = s;
  const nm = $("slotName"); nm.classList.remove("idle"); nm.textContent = s[0];
  $("slotArea").textContent = s[1] + " · " + s[2];
  $("slotDesc").textContent = s[3];
  $("slotMeta").innerHTML =
    `<span class="tag rar-${s[4]}">${s[4]==="SSR"?"✨ 稀有 SSR":s[4]==="SR"?"💜 SR":"🔹 R"}</span>` +
    `<span class="tag">${s[1]}</span><span class="tag">${s[2]}</span>`;
  history.push({name:s[0], area:s[1]});
  renderHistory();
  setTimeout(openAsk, 480);
}
function renderHistory(){
  const ul = $("historyList");
  if(!history.length){ ul.innerHTML = '<li class="empty">还没有记录。命运尚未开始。</li>'; return; }
  ul.innerHTML = history.slice().reverse().map((h,i)=>
    `<li><span class="h-area">${h.area}</span><span>${h.name}</span><span style="margin-left:auto;color:#b9c4be;font-size:11.5px">#${history.length-i}</span></li>`
  ).join("");
}

/* ---------- 弹窗（含「点不到的不想去」） ---------- */
let escapeCount = 0, accepted = false, lastFlee = 0;
const NO_TEXTS = ["不想去的","再想想嘛","真的不再考虑一下？","最后一个问题","……别这样","你说去哪就去哪还不行吗","我错了还不行吗","哎呀手滑了"];
const HINTS = ["按钮有点害羞，多点几下试试","它跑得快不代表它不同意","再试试，也许它就认了","这已经是第N次了，你认真的？"];

function openAsk(){
  if(!current) return;
  accepted = false; escapeCount = 0;
  resetNo();
  $("askSpot").textContent = current[0];
  $("askTitle").textContent = "这个周末，去这儿？";
  $("askWhy").textContent = current[3];
  $("answerBox").innerHTML = `
      <div class="answers">
        <button class="yes" id="yesBtn">好啊，走！</button>
        <button class="no" id="noBtn">不想去</button>
      </div>
      <div style="margin-top:12px;font-size:12px;color:#a9b5af" id="escapeHint">${HINTS[0]}</div>`;
  $("yesBtn").onclick = accept;
  bindNo();
  $("mask").classList.add("show");
}
function bindNo(){
  const nb = $("noBtn");
  /* 注意：绝不 preventDefault，否则 pointerdown 会吞掉 click */
  const tryFlee = ()=>{ const now=Date.now(); if(now-lastFlee<180) return; lastFlee=now; runAway(nb); };
  const fleeHard = ()=>runAway(nb);
  nb.addEventListener("mouseenter", fleeHard);
  nb.addEventListener("mousemove", tryFlee);
  nb.addEventListener("pointerdown", fleeHard);
  nb.addEventListener("touchstart", fleeHard, {passive:false});
  nb.addEventListener("click", ()=>fleeHard());
}
function resetNo(){
  const nb = $("noBtn");
  if(nb){ nb.style.cssText = ""; nb.classList.remove("fixed"); }
}
function runAway(btn){
  if(escapeCount >= 6) return;
  escapeCount++;
  if(escapeCount >= 6){
    btn.classList.remove("fixed");
    btn.style.cssText = "";
    btn.textContent = "好吧，那就去吧";
    btn.style.borderColor = "var(--green)";
    btn.style.color = "var(--green)";
    btn.onclick = e => { e.preventDefault(); accept(); };
    const hint = $("escapeHint");
    if(hint) hint.textContent = "它放弃了。点它，或者点左边那个，反正结果一样。";
    return;
  }
  const w = innerWidth, h = innerHeight;
  const bw = btn.offsetWidth || 120, bh = btn.offsetHeight || 46;
  const modalRect = $("modal").getBoundingClientRect();
  let x = 0, y = 0, ok = false;
  for(let i=0;i<30;i++){
    x = Math.random()*Math.max(10, w-bw-20)+10;
    y = Math.random()*Math.max(10, h-bh-20)+10;
    const safe = !(modalRect.left-bw-20 < x+bw && x < modalRect.right+20 && modalRect.top-bh-10 < y+bh && y < modalRect.bottom+10);
    if(safe){ ok = true; break; }
  }
  if(!ok){ x = 20; y = 20; }
  btn.classList.add("fixed");
  btn.style.left = x+"px";
  btn.style.top = y+"px";
  btn.style.transform = `rotate(${(Math.random()*24-12).toFixed(1)}deg)`;
  btn.textContent = NO_TEXTS[Math.min(escapeCount, NO_TEXTS.length-1)];
  const hint = $("escapeHint");
  if(hint) hint.textContent = escapeCount >= 4 ? `已经躲了 ${escapeCount} 次，它快没力气了` : HINTS[Math.min(escapeCount, HINTS.length-1)];
}
function accept(){
  if(accepted) return; accepted = true;
  const box = $("answerBox");
  box.innerHTML = `
    <div class="done-wrap">
      <div class="done-title">🎉 就这么定了</div>
      <div class="done-sub">
        目的地：<b>${current[0]}</b>（${current[1]}·${current[2]}）<br>
        已经记下了，不许反悔。躲了 ${escapeCount} 次还是没躲掉，这下跑不掉了。
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="ghost-btn" id="copyBtn2">复制文案</button>
        <button class="ghost-btn" id="redrawBtn">再抽一个</button>
      </div>
    </div>`;
  $("copyBtn2").onclick = ()=>copyText();
  $("redrawBtn").onclick = ()=>{ closeAsk(); draw(); };
  confetti();
}
function closeAsk(){ $("mask").classList.remove("show"); resetNo(); }

function copyText(){
  if(!current) return;
  const t = `这个周末，去【${current[0]}】？\n${current[3]}\n（${current[1]}·${current[2]}）\n别问为什么是这里，抽签决定的，天命不可违。`;
  const done = ()=>toast("文案已复制 🎉");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，手动抄：" + t); }
  document.body.removeChild(ta);
}

/* ---------- 彩带 ---------- */
function confetti(){
  const c = $("confetti"), ctx = c.getContext("2d");
  c.style.display = "block";
  c.width = innerWidth; c.height = innerHeight;
  const colors = ["#1b7f5c","#e8552d","#f0c04a","#7a5bd6","#39a3f4","#f472a6"];
  const ps = Array.from({length:140},()=>({
    x: Math.random()*c.width, y: -Math.random()*c.height*0.6,
    w: 6+Math.random()*6, h: 8+Math.random()*8,
    vy: 2+Math.random()*3.2, vx: -1.4+Math.random()*2.8,
    rot: Math.random()*Math.PI, vr: -0.14+Math.random()*0.28,
    col: colors[Math.floor(Math.random()*colors.length)]
  }));
  let frames = 0;
  (function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vy+=0.02;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    frames++;
    if(frames<190) requestAnimationFrame(loop);
    else { ctx.clearRect(0,0,c.width,c.height); c.style.display="none"; }
  })();
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

$("drawBtn").onclick = draw;
$("againBtn").onclick = ()=>{ closeAsk(); draw(); };
$("copyBtn").onclick = copyText;
$("mask").addEventListener("click", e=>{ if(e.target.id==="mask") closeAsk(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeAsk(); });

updateCount();
</script>
