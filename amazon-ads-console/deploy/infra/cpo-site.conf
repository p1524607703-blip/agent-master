server {
    listen 80 ssl default_server;
    listen [::]:80 ssl default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name {{SERVER_NAME}};
    ssl_certificate {{CERTIFICATE_DIR}}/fullchain.pem;
    ssl_certificate_key {{CERTIFICATE_DIR}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 = @plain_http;
    location @plain_http {
        root /var/www/html;
        if ($uri !~ "^/\.well-known/acme-challenge/") {
            return 301 https://{{SERVER_NAME}}:80$request_uri;
        }
        try_files $uri =404;
    }
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    root /var/www/cpo-console;
    index index.html;
    client_max_body_size 120m;
    include /etc/nginx/snippets/cpo-response-headers.conf;
    location = /api/auth/login {
        limit_req zone=cpo_login burst=30 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        include /etc/nginx/snippets/cpo-api-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/snippets/cpo-api-proxy.conf;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/cpo-response-headers.conf;
        add_header Cache-Control no-cache;
    }
}
