# http context. Only validated, explicitly allowed query dimensions are logged.
map $arg_date $cpo_log_date { default ""; "~^\d{4}-\d{2}-\d{2}$" $arg_date; }
map $arg_end_date $cpo_log_end_date { default ""; "~^\d{4}-\d{2}-\d{2}$" $arg_end_date; }
map $arg_period $cpo_log_period { default ""; ~^(daily|weekly|monthly)$ $arg_period; }
map $uri $cpo_log_endpoint {
    default $uri;
    ~^/api/cpo/imports/[^/]+/commit$ "/api/cpo/imports/{token}/commit";
}
log_format cpo_api escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","endpoint":"$cpo_log_endpoint","status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time","date":"$cpo_log_date","end_date":"$cpo_log_end_date","period":"$cpo_log_period"}';
# A shared office can burst 30 logins; steady 60/minute per source address.
limit_req_zone $binary_remote_addr zone=cpo_login:10m rate=60r/m;
