services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amazon_ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads -d amazon_ads"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
